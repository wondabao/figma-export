[package]
name = "figma-export-tauri-prototype"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
