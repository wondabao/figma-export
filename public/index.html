<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-root">
    <!-- 顶部一体化标题栏（与 macOS 交通信号灯同行） -->
    <header class="window-topbar">
      <div class="topbar-left-spacer" aria-hidden="true"></div>

      <div class="segmented-tabs" role="tablist" aria-label="功能模式切换">
        <button class="seg-tab active" id="tabExport" role="tab" aria-selected="true">批量导出</button>
        <button class="seg-tab" id="tabImport" role="tab" aria-selected="false">批量导入</button>
      </div>

      <div class="topbar-right">
        <button class="btn-login-pill" id="btnLoginTop">登录 Figma</button>

        <div class="user-menu-wrap hidden" id="userMenuWrap">
          <button class="user-trigger" id="btnUserTrigger" type="button">
            <span class="user-avatar" id="userAvatar">A</span>
            <span class="user-name" id="userNameText">Figma</span>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6l4 4 4-4"/>
            </svg>
          </button>
          <div class="popover-menu hidden" id="userDropdown">
            <div class="popover-user-email" id="userEmailText"></div>
            <button class="popover-item" id="btnRecheckAuth" type="button">打开 Figma 登录页</button>
            <button class="popover-item danger" id="btnSwitchAccount" type="button">切换账号 / 退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主工作区 -->
    <main class="workspace-grid">
      <div class="card main-workspace-card">
        <!-- ==================== 左栏：工作空间导航 ==================== -->
        <aside class="nav-sidebar">
        <div class="brand-header">
          <div class="figma-icon-box" aria-hidden="true">
            <svg width="17" height="24" viewBox="41.65 10.41 58.72 92.28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M56.3362 102.684C64.4381 102.684 71.0136 95.7941 71.0136 87.3047V71.9254H56.3362C48.2344 71.9254 41.6589 78.8153 41.6589 87.3047C41.6589 95.7941 48.2344 102.684 56.3362 102.684Z" fill="#0ACF83"/>
              <path d="M41.6589 56.5483C41.6589 48.0589 48.2344 41.169 56.3362 41.169H71.0136V71.9276H56.3362C48.2344 71.9276 41.6589 65.0377 41.6589 56.5483Z" fill="#A259FF"/>
              <path d="M41.6666 25.7917C41.6666 17.3023 48.242 10.4124 56.3439 10.4124H71.0212V41.171H56.3439C48.242 41.171 41.6666 34.2811 41.6666 25.7917Z" fill="#F24E1E"/>
              <path d="M71.0102 10.4124H85.6875C93.7894 10.4124 100.365 17.3023 100.365 25.7917C100.365 34.2811 93.7894 41.1711 85.6875 41.1711H71.0102V10.4124Z" fill="#FF7262"/>
              <path d="M100.365 56.5483C100.365 65.0377 93.7894 71.9276 85.6875 71.9276C77.5856 71.9276 71.0102 65.0377 71.0102 56.5483C71.0102 48.0589 77.5856 41.169 85.6875 41.169C93.7894 41.169 100.365 48.0589 100.365 56.5483Z" fill="#1ABCFE"/>
            </svg>
          </div>
          <span class="brand-title" id="sidebarBrandTitle">Figma Export</span>
        </div>

        <div class="nav-section-row">
          <span class="nav-section-label" id="navSectionLabel">工作空间</span>
          <button class="nav-section-add-btn" id="btnHeaderAddTeam" type="button" title="补充隐藏团队" aria-label="补充隐藏团队">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <nav class="nav-list" id="workspaceNavList"></nav>

        <div class="nav-footer hidden" id="navFooter">
          <button class="nav-item nav-action-btn" id="btnNavAddFiles" type="button">
            <span class="nav-item-left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>添加文件</span>
            </span>
          </button>
        </div>
      </aside>

      <!-- ==================== 中栏 A：云端文件（批量导出） ==================== -->
      <section class="center-card" id="exportCenterCard">
        <!-- 搜索与筛选行 -->
        <div class="filter-bar">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索团队、文件夹或文件" />
          </div>

          <div class="filter-dropdown-wrap">
            <button class="pill-btn" id="btnExportFilterToggle" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              <span>筛选</span>
              <span class="filter-dot hidden" id="exportFilterDot"></span>
            </button>

            <div class="popover-filter hidden" id="exportFilterPopover">
              <div class="popover-field">
                <label>文件格式</label>
                <select id="typeFilter" class="clean-select">
                  <option value="all">全部格式</option>
                  <option value="design">Design (.fig)</option>
                  <option value="whiteboard">FigJam (.jam)</option>
                  <option value="slides">Slides (.deck)</option>
                </select>
              </div>
              <div class="popover-field">
                <label>备份状态</label>
                <select id="statusFilter" class="clean-select">
                  <option value="all">全部状态</option>
                  <option value="need_export">待导出 / 有更新</option>
                  <option value="exported">已备份</option>
                  <option value="failed">失败</option>
                </select>
              </div>
              <button class="text-link-btn" id="btnResetExportFilters" type="button">重置筛选条件</button>
            </div>
          </div>

          <button class="pill-btn" id="btnToggleExpand" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            <span id="expandBtnText">展开全部</span>
          </button>
          <button class="pill-btn" id="btnScan" type="button" title="重新扫描" aria-label="重新扫描">
            <svg class="icon-spin-target" id="scanIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
            </svg>
          </button>
        </div>

        <!-- 树形表格区 -->
        <div class="table-shell">
          <div class="table-head hidden" id="exportTableHead">
            <div class="col-check">
              <input type="checkbox" class="dark-cb" id="exportMasterCb" />
            </div>
            <div class="col-name">名称</div>
            <div class="col-format">格式</div>
            <div class="col-status">状态</div>
          </div>

          <div class="table-body" id="treeContainer"></div>
        </div>

        <!-- 底部选择统计栏 -->
        <div class="center-footer hidden" id="exportCenterFooter">
          <span class="footer-selected-text" id="selectionSummary">已选 0 个文件</span>
          <button class="footer-clear-btn" id="btnClearOrSelectAll" type="button">清除选择</button>
        </div>
      </section>

      <!-- ==================== 中栏 B：本地文件（批量导入） ==================== -->
      <section class="center-card hidden" id="importCenterCard">
        <div class="filter-bar">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/>
            </svg>
            <input type="text" id="importSearchInput" placeholder="搜索本地文件名或所属目录" />
          </div>

          <div class="header-btn-group hidden" id="importPickerActions">
            <button class="pill-btn" id="btnPickImportFiles" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>选择文件</span>
            </button>
            <button class="pill-btn" id="btnPickImportFolder" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              </svg>
              <span>选择文件夹</span>
            </button>
          </div>

          <div class="filter-dropdown-wrap">
            <button class="pill-btn" id="btnImportFilterToggle" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              <span>筛选</span>
              <span class="filter-dot hidden" id="importFilterDot"></span>
            </button>

            <div class="popover-filter hidden" id="importFilterPopover">
              <div class="popover-field">
                <label>文件后缀</label>
                <select id="importExtFilter" class="clean-select">
                  <option value="all">全部格式</option>
                  <option value=".fig">.fig (Design)</option>
                  <option value=".jam">.jam (FigJam)</option>
                  <option value=".deck">.deck (Slides)</option>
                  <option value=".sketch">.sketch</option>
                </select>
              </div>
              <div class="popover-field">
                <label>导入状态</label>
                <select id="importStatusFilter" class="clean-select">
                  <option value="all">全部状态</option>
                  <option value="pending">待导入</option>
                  <option value="imported">已导入 / 已跳过</option>
                  <option value="failed">失败</option>
                </select>
              </div>
              <button class="text-link-btn" id="btnResetImportFilters" type="button">重置筛选条件</button>
            </div>
          </div>

          <button class="pill-btn" id="btnClearImportQueue" type="button">清空列表</button>
        </div>

        <div class="table-shell dropzone-shell" id="importDropzone">
          <div class="table-head hidden" id="importTableHead">
            <div class="col-check">
              <input type="checkbox" class="dark-cb" id="importMasterCb" />
            </div>
            <div class="col-name">名称</div>
            <div class="col-format">格式</div>
            <div class="col-status">状态</div>
          </div>

          <div class="table-body" id="importTreeContainer"></div>
        </div>

        <div class="center-footer hidden" id="importCenterFooter">
          <span class="footer-selected-text" id="importSelectionSummary">已选 0 个文件</span>
          <button class="footer-clear-btn" id="btnImportClearOrSelectAll" type="button">清除选择</button>
        </div>
      </section>
      </div>

      <!-- ==================== 右栏：设置卡片 +（工作中）进度卡片 ==================== -->
      <aside class="right-column">
        <div class="card settings-shell-card" id="settingsShellCard">
          <!-- 导出设置 -->
          <div class="settings-card" id="exportSettingsCard">
          <h2 class="card-title">导出设置</h2>

          <div class="setting-block">
            <div class="setting-caption">备份位置</div>
            <div class="path-picker-row">
              <button class="path-display-btn" id="btnOpenFolder" type="button" title="点击打开此文件夹">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <span id="outputDirDisplay">~/Documents/Figma Exports</span>
              </button>
              <button class="pill-btn btn-compact" id="btnChooseDir" type="button">更改</button>
            </div>
          </div>

          <div class="switch-rows">
            <label class="switch-row">
              <span class="switch-label">增量备份</span>
              <input type="checkbox" class="ios-switch" id="optSkipExported" checked />
            </label>
            <label class="switch-row">
              <span class="switch-label">包含个人草稿</span>
              <input type="checkbox" class="ios-switch" id="optIncludeDrafts" checked />
            </label>
            <label class="switch-row">
              <span class="switch-label">后台静默导出</span>
              <input type="checkbox" class="ios-switch" id="optSilentExport" checked />
            </label>
            <div class="switch-row">
              <span class="switch-label">单文件超时</span>
              <div class="timeout-box">
                <input type="number" id="optTimeoutSec" class="num-input" min="30" max="1200" value="180" />
                <span class="unit-text">秒</span>
              </div>
            </div>
          </div>
        </div>

          <!-- 导入设置 -->
          <div class="settings-card hidden" id="importSettingsCard">
          <div class="card-title-row">
            <h2 class="card-title">导入设置</h2>
            <button class="text-link-btn" id="btnRefreshTargets" type="button">↻ 刷新团队</button>
          </div>

          <div class="setting-block">
            <div class="setting-caption">目标位置</div>
            <select id="importTargetMode" class="clean-select full-width">
              <option value="drafts">个人草稿箱 (Drafts)</option>
              <option value="folder">指定团队与文件夹</option>
              <option value="structure">按本地目录自动建文件夹还原</option>
            </select>
          </div>

          <div class="setting-block hidden" id="importTeamField">
            <div class="setting-caption">目标团队</div>
            <select id="importTeamSelect" class="clean-select full-width">
              <option value="">请点击右上角「↻ 刷新团队」</option>
            </select>
          </div>

          <div class="setting-block hidden" id="importFolderField">
            <div class="setting-caption">目标文件夹</div>
            <div class="path-picker-row">
              <select id="importFolderSelect" class="clean-select" style="flex: 1; min-width: 0;">
                <option value="">请先选择团队</option>
              </select>
              <button class="pill-btn btn-compact" id="btnNewFigmaFolder" type="button">+ 新建</button>
            </div>
          </div>

          <div class="switch-rows">
            <label class="switch-row">
              <span class="switch-label">跳过同名文件</span>
              <input type="checkbox" class="ios-switch" id="optImportSkipExisting" checked />
            </label>
            <label class="switch-row">
              <span class="switch-label">后台静默导入</span>
              <input type="checkbox" class="ios-switch" id="optImportSilent" checked />
            </label>
            <div class="switch-row">
              <span class="switch-label">单文件超时</span>
              <div class="timeout-box">
                <input type="number" id="optImportTimeoutSec" class="num-input" min="30" max="1800" value="240" />
                <span class="unit-text">秒</span>
              </div>
            </div>
          </div>
        </div>

          <div class="cta-stack" id="idleCtaStack">
            <button class="btn-primary-dark" id="btnPrimaryAction" type="button" disabled>
              导出 0 个文件
            </button>
            <button class="retry-text-btn hidden" id="btnRetryAction" type="button">
              重试 0 个失败项
            </button>
          </div>
        </div>

        <!-- 进度卡片（仅在导入或导出进行中显示） -->
        <div class="card progress-card hidden" id="progressCard">
          <div class="progress-top">
            <h2 class="card-title" id="progressTitle">导出进度</h2>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>

          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
          </div>

          <div class="progress-status-line" id="progressMeta">正在准备...</div>

          <div class="progress-pills">
            <span class="stat-pill">成功 <b id="cntSucceeded">0</b></span>
            <span class="stat-pill">跳过 <b id="cntSkipped">0</b></span>
            <span class="stat-pill danger">失败 <b id="cntFailed">0</b></span>
          </div>

          <div class="cta-stack">
            <button class="btn-stop-outline" id="btnStopAction" type="button">
              停止任务
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- 底部状态栏 -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="status-dot" id="statusBarDot"></span>
        <span class="status-text" id="statusBarText">准备就绪</span>
      </div>
      <div class="status-right">
        <button class="activity-log-trigger" id="btnToggleLogDrawer" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
          </svg>
          <span>活动日志</span>
        </button>
        <button class="version-trigger" id="btnVersion" type="button" aria-label="查看版本与更新">版本</button>
      </div>
    </footer>

    <!-- 活动日志抽屉弹窗 -->
    <div class="log-drawer hidden" id="logDrawer">
      <div class="log-drawer-header">
        <span class="log-drawer-title">活动日志</span>
        <div class="log-drawer-actions">
          <button class="text-link-btn" id="btnClearLogs" type="button">清空</button>
          <button class="icon-close-btn" id="btnCloseLogDrawer" type="button" aria-label="关闭日志">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="log-console" id="logConsole"></div>
    </div>

    <dialog class="version-dialog" id="versionModal" aria-labelledby="versionDialogTitle">
        <div class="modal-header">
          <h3 id="versionDialogTitle">关于</h3>
          <button class="icon-close-btn modal-close-btn" id="btnCloseVersion" type="button" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="version-app">
          <svg class="version-app-icon" viewBox="100 100 824 824" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="aboutIconBgGrad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1E2230"/>
                <stop offset="100%" stop-color="#141720"/>
              </linearGradient>
            </defs>
            <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#aboutIconBgGrad)"/>
            <rect x="106" y="106" width="812" height="812" rx="179" stroke="#2D3346" stroke-width="10"/>
            <g transform="translate(113, 199) scale(5.4)">
              <path d="M56.3362 102.684C64.4381 102.684 71.0136 95.7941 71.0136 87.3047V71.9254H56.3362C48.2344 71.9254 41.6589 78.8153 41.6589 87.3047C41.6589 95.7941 48.2344 102.684 56.3362 102.684Z" fill="#0ACF83"/>
              <path d="M41.6589 56.5483C41.6589 48.0589 48.2344 41.169 56.3362 41.169H71.0136V71.9276H56.3362C48.2344 71.9276 41.6589 65.0377 41.6589 56.5483Z" fill="#A259FF"/>
              <path d="M41.6666 25.7917C41.6666 17.3023 48.242 10.4124 56.3439 10.4124H71.0212V41.171H56.3439C48.242 41.171 41.6666 34.2811 41.6666 25.7917Z" fill="#F24E1E"/>
              <path d="M71.0102 10.4124H85.6875C93.7894 10.4124 100.365 17.3023 100.365 25.7917C100.365 34.2811 93.7894 41.1711 85.6875 41.1711H71.0102V10.4124Z" fill="#FF7262"/>
              <path d="M100.365 56.5483C100.365 65.0377 93.7894 71.9276 85.6875 71.9276C77.5856 71.9276 71.0102 65.0377 71.0102 56.5483C71.0102 48.0589 77.5856 41.169 85.6875 41.169C93.7894 41.169 100.365 48.0589 100.365 56.5483Z" fill="#1ABCFE"/>
            </g>
            <circle cx="728" cy="728" r="112" fill="#0D99FF" stroke="#151822" stroke-width="16"/>
            <path d="M728 674V768M728 768L690 730M728 768L766 730" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="version-app-name">Figma Export</div>
        </div>
        <div class="version-card">
          <div class="version-card-main">
            <div class="version-info">
              <div class="version-current" id="versionCurrent">当前版本</div>
              <p class="version-status" id="versionStatus" aria-live="polite">正在检查更新…</p>
            </div>
            <div class="version-actions">
              <button class="about-action" id="btnOpenGithub" type="button">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                </svg>
                <span>GitHub</span>
              </button>
              <button class="about-action primary" id="btnCheckUpdate" type="button">检查更新</button>
              <button class="about-action primary hidden" id="btnUpdateAction" type="button">立即更新</button>
            </div>
          </div>
          <div class="version-progress hidden" id="versionProgressWrap">
            <div class="version-progress-bar">
              <div class="version-progress-fill" id="versionProgressFill" style="width: 0%"></div>
            </div>
          </div>
        </div>
        <div class="about-links">
          <button type="button" data-policy="terms">用户协议<span aria-hidden="true">›</span></button>
          <button type="button" data-policy="privacy">隐私政策<span aria-hidden="true">›</span></button>
          <button type="button" id="btnOpenWebsite">进入官网<span aria-hidden="true">↗</span></button>
        </div>
    </dialog>

    <dialog class="policy-dialog" id="policyModal" aria-label="协议阅读窗口">
      <form method="dialog"><button class="pill-btn" type="submit" autofocus>返回关于</button></form>
      <iframe id="policyReader" title="协议正文" sandbox="allow-same-origin"></iframe>
    </dialog>

    <!-- 添加团队弹窗 -->
    <div class="modal-backdrop hidden" id="addTeamModal">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3>补充隐藏团队</h3>
          <button class="icon-close-btn modal-close-btn" id="btnCloseTeamModal" type="button" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <p class="modal-desc">常规团队在扫描时会自动发现，无需手动添加。仅当存在未加入的企业公开团队或外部分享团队时，可粘贴包含 <code>/team/数字</code> 的链接或纯数字 Team ID：</p>
        <div class="modal-input-row">
          <input type="text" id="manualTeamInput" class="clean-input" placeholder="https://www.figma.com/files/team/123456789/..." />
          <button class="btn-modal-submit" id="btnAddTeam" type="button">添加</button>
        </div>
        <div class="extra-teams-chips" id="extraTeamsChips"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
