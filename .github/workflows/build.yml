name: Build macOS & Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            rust_target: aarch64-apple-darwin
          - os: macos-15
            platform: mac
            rust_target: x86_64-apple-darwin
          - os: windows-2025
            platform: win
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype/tauri/src-tauri

      - name: Install dependencies
        run: npm --prefix prototype/tauri ci

      - name: Verify release version
        if: github.ref_type == 'tag'
        run: |
          node -e "
            const tag = process.env.GITHUB_REF_NAME;
            const rootVer = 'v' + require('./package.json').version;
            const tauriVer = 'v' + require('./prototype/tauri/src-tauri/tauri.conf.json').version;
            if (tag !== rootVer || tag !== tauriVer) {
              throw new Error('Tag must match package.json and tauri.conf.json versions');
            }
          "

      - name: Build Tauri installer
        run: node prototype/tauri/build-release.cjs --target ${{ matrix.rust_target }}

      - name: Verify macOS disk image
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          for dmg in dist/figma-export-*-mac-*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Test Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-Item 'dist/figma-export-*-win-x64-setup.exe'
          if (!$setup) { throw 'Missing Windows installer build' }
          $installDir = Join-Path $env:RUNNER_TEMP 'FigmaExport'
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installation failed with exit code $($install.ExitCode)"
          }
          $exeFound = Get-ChildItem -Path @($installDir, (Join-Path $env:LOCALAPPDATA 'Figma Export')) -Filter '*.exe' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike 'uninstall*' }
          if (!$exeFound) {
            throw 'Installed executable missing'
          }

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.rust_target }}
          path: |
            dist/figma-export-*.dmg
            dist/figma-export-*.exe
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: Publish GitHub release
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=(
            "figma-export-$version-mac-arm64.dmg"
            "figma-export-$version-mac-x64.dmg"
            "figma-export-$version-win-x64-setup.exe"
          )
          sha256sum "${files[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${files[@]}" SHA256SUMS.txt
